stages:
  - test

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  NODE_ENV: test

test_app:
  stage: test
  image: docker:24

  services:
    - name: docker:24-dind
      command: ["--tls=false"]

  before_script:
    - apk add --no-cache nodejs npm docker-compose
    - npm install

  script:
    - docker-compose up -d
    # Run unit tests
    - npm run test:e2e -- --detectOpenHandles --forceExit --runInBand --no-cache


  after_script:
    - docker-compose down

