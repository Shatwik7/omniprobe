stages:
  - test

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  NODE_ENV: test
  # Added Environment Variables
  REDIS_HOST: "localhost"
  REDIS_PORT: "6379"
  POSTGRES_HOST: "localhost"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  POSTGRES_DB: "mydatabase"
  JWT_SECRET: "jwt-secret"
  JWT_EXPIRATION: "1d"
  REDIS_URL: "redis://localhost:6379"
  KAFKA_URL: "localhost:9092"

test_app:
  stage: test
  image: docker:24

  services:
    - name: docker:24-dind
      command: ["--tls=false"]

  before_script:
    - apk add --no-cache nodejs npm docker-compose
    - npm install

  script:
    - docker-compose up -d
    # Run unit tests
    - npm run test -- --detectOpenHandles --forceExit
    # Run e2e tests
    - npm run test:e2e -- --detectOpenHandles --forceExit

  after_script:
    - docker-compose down

